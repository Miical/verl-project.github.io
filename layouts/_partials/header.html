<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark" aria-hidden="true">verl</span>
      <span class="brand-text">Blog</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      {{- range site.Menus.main }}
      {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
      <a href="{{ .URL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <a href="{{ site.Params.repo.main }}" class="nav-external" rel="noopener">GitHub</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
      <span class="theme-icon theme-icon-light">{{ partial "icon.html" "sun" }}</span>
      <span class="theme-icon theme-icon-dark">{{ partial "icon.html" "moon" }}</span>
    </button>
  </div>
</header>

<script>
  document.querySelector(".theme-toggle").addEventListener("click", function () {
    var root = document.documentElement;
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
</script>
