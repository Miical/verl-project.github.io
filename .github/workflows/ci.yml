name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.164.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posts:
    name: Validate front matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pyyaml
      - run: python3 scripts/check_posts.py

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: posts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        run: |
          curl -sSLo /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      # Drafts and future-dated posts are built here (but never deployed) so a
      # scheduled post cannot break the site on the day it goes live.
      - name: Build
        run: hugo --gc --minify --buildDrafts --buildFuture --printPathWarnings

      - name: Fail on broken internal links
        run: python3 scripts/check_links.py
